# Native Swift slot jobs for canonical check names (CI / quality / <ID>: <Name>).
# Logic mirrors prior test-job invocations; steps are inlined to avoid nested check-name suffixes.
name: CI Quality Slots

on:
  workflow_call:
    inputs:
      enable-g2:
        description: "Run G2 dependency scan (default off for native Swift)"
        type: boolean
        default: false
      enable-l15:
        description: "Run L1.5 worker runtime tests"
        type: boolean
        default: false
      enable-l2:
        description: "Run L2 API E2E"
        type: boolean
        default: false
      enable-l3:
        description: "Run L3 browser E2E"
        type: boolean
        default: false
      enable-p1:
        description: "Run P1 package check"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Typecheck"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare macOS toolchain
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          swiftlint version
          xcrun swift-format --version
      - name: S1 typecheck
        run: |
          python3 scripts/version.py
          swift build -Xswiftc -warnings-as-errors
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare macOS toolchain
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          swiftlint version
          xcrun swift-format --version
      - name: S2 lint
        run: ./scripts/lint.sh
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Check immutable shared workflow references
        run: |
          python3 - <<'PY'
          import pathlib, re, yaml
          files = list(pathlib.Path('.github/workflows').glob('*.y*ml'))
          references = []
          for path in files:
              data = yaml.safe_load(path.read_text())
              for job in data.get('jobs', {}).values():
                  if isinstance(job, dict):
                      if 'uses' in job:
                          references.append(job['uses'])
                      for step in job.get('steps', []) or []:
                          if isinstance(step, dict) and 'uses' in step:
                              references.append(step['uses'])
          for ref in references:
              if ref.startswith('nocoo/base-ci/') and not re.fullmatch(r'nocoo/base-ci/[^@]+@[a-f0-9]{40}', ref):
                  raise SystemExit(f'Shared CI reference must use a full commit SHA: {ref}')
          required = '.github/workflows/ci-quality-slots.yml'
          if not any(required in ref for ref in references):
              raise SystemExit(f'Missing required reusable workflow: {required}')
          print(f'Validated {len(files)} workflow files and immutable base-ci references')
          PY
      - name: Check YAML style
        run: |
          python3 -m pip install --quiet 'yamllint==1.38.0'
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' .github/workflows/*.yml
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secret Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install security scanners
        uses: nocoo/base-ci/.github/actions/setup-security-scanners@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
      - name: Gitleaks secret scan
        run: gitleaks detect --no-banner --verbose --redact --no-git
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependency Vulnerabilities"
    if: ${{ inputs.enable-g2 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — no lockfile for OSV"

  b1-build:
    name: "B1: Build"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare macOS toolchain
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          swiftlint version
          xcrun swift-format --version
      - name: B1 build
        run: |
          ./scripts/build.sh -quiet
          swift build --configuration release -Xswiftc -warnings-as-errors
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit Tests & Coverage"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare macOS toolchain
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          swiftlint version
          xcrun swift-format --version
      - name: L1 unit tests
        run: |
          swift test -Xswiftc -warnings-as-errors
          swift build --target InfoSpaceExamples -Xswiftc -warnings-as-errors
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l15-worker-runtime:
    name: "L1.5: Worker Runtime Tests"
    if: ${{ inputs.enable-l15 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l2-api-e2e:
    name: "L2: API E2E"
    if: ${{ inputs.enable-l2 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — no HTTP API E2E"

  l3-browser-e2e:
    name: "L3: Browser E2E"
    if: ${{ inputs.enable-l3 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — native UI verified manually"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ inputs.enable-p1 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — Swift Package source, not npm publish"

  z1-gate:
    name: "Z1: Gate"
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l15-worker-runtime
      - l2-api-e2e
      - l3-browser-e2e
      - p1-package-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Z1: Require every implemented slot job on this commit"
        env:
          S1_RESULT: ${{ needs.s1-typecheck.result }}
          S2_RESULT: ${{ needs.s2-lint.result }}
          S3_RESULT: ${{ needs.s3-workflow-lint.result }}
          G1_RESULT: ${{ needs.g1-secret-scan.result }}
          G2_RESULT: ${{ needs.g2-dependency-vulnerabilities.result }}
          B1_RESULT: ${{ needs.b1-build.result }}
          L1_RESULT: ${{ needs.l1-unit-tests.result }}
          L15_RESULT: ${{ needs.l15-worker-runtime.result }}
          L2_RESULT: ${{ needs.l2-api-e2e.result }}
          L3_RESULT: ${{ needs.l3-browser-e2e.result }}
          P1_RESULT: ${{ needs.p1-package-check.result }}
          S1_SHA: ${{ needs.s1-typecheck.outputs.tested-sha }}
          S2_SHA: ${{ needs.s2-lint.outputs.tested-sha }}
          S3_SHA: ${{ needs.s3-workflow-lint.outputs.tested-sha }}
          G1_SHA: ${{ needs.g1-secret-scan.outputs.tested-sha }}
          B1_SHA: ${{ needs.b1-build.outputs.tested-sha }}
          L1_SHA: ${{ needs.l1-unit-tests.outputs.tested-sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          require_success() {
            local label="$1" result="$2"
            if [ "$result" != success ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected success)."
              exit 1
            fi
          }
          require_skipped() {
            local label="$1" result="$2"
            if [ "$result" != skipped ]; then
              echo "::error::Z1: Gate — $label result was '$result' (expected skipped)."
              exit 1
            fi
          }
          require_success "S1: Typecheck" "$S1_RESULT"
          require_success "S2: Lint" "$S2_RESULT"
          require_success "S3: Workflow Lint" "$S3_RESULT"
          require_success "G1: Secret Scan" "$G1_RESULT"
          require_skipped "G2: Dependency Vulnerabilities" "$G2_RESULT"
          require_success "B1: Build" "$B1_RESULT"
          require_success "L1: Unit Tests & Coverage" "$L1_RESULT"
          require_skipped "L1.5: Worker Runtime Tests" "$L15_RESULT"
          require_skipped "L2: API E2E" "$L2_RESULT"
          require_skipped "L3: Browser E2E" "$L3_RESULT"
          require_skipped "P1: Package Check" "$P1_RESULT"
          for sha in "$S1_SHA" "$S2_SHA" "$S3_SHA" "$G1_SHA" "$B1_SHA" "$L1_SHA"; do
            if [ "$sha" != "$EXPECTED_SHA" ]; then
              echo "::error::Z1: Gate — tested-sha mismatch (got '$sha', expected '$EXPECTED_SHA')."
              exit 1
            fi
          done
          echo "Z1: Gate — all slots match declaration on $EXPECTED_SHA"

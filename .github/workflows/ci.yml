name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runner: "macos-26"
      runtime: "none"
      timeout-minutes: 20
      pre-command: |
        if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
        if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
        swiftlint version
        xcrun swift-format --version
      command: |
        ./scripts/check.sh
        ./scripts/build.sh -quiet
      env-json: '{"DEVELOPER_DIR": "/Applications/Xcode_26.6.app/Contents/Developer"}'

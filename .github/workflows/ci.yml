# CI slot standard v1.3.0 (system1-quality): canonical names via caller job `quality` + quality-slots.yml;
# native Swift commands inlined (not nocoo/base-ci quality.yml). base-ci v2026.18 for actions only.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

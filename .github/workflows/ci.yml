name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install development tools
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          swiftlint version
          xcrun swift-format --version
      - name: Lint, unit tests, consumer examples and Release build
        run: ./scripts/check.sh
      - name: Build native demo bundle
        run: ./scripts/build.sh -quiet

# CI slot standard v1 (nocoo/base-ci docs/slots.md): canonical names via caller job `quality` + ci-quality-slots.yml;
# native Swift commands inlined (not nocoo/base-ci quality.yml). base-ci v2026.12 for actions only.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci-quality-slots.yml
